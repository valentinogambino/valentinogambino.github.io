<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="{{lang}}" href="{{canonical}}">
<link rel="alternate" hreflang="{{otherLang}}" href="{{otherCanonical}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="{{root}}styles.css">
</head>
<body>
<nav class="controls" aria-label="{{controlsLabel}}">
  <a href="{{otherLangHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}">{{otherLangLabel}}</a>
  <a href="{{pdfHref}}" download>{{downloadPdf}}</a>
</nav>
<main class="sheet">
{{body}}
</main>
</body>
</html>
